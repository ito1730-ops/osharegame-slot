<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>おしゃれスロット</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>


    <!-- ========================
         タイトル画面
    ========================= -->

    <div id="titleScreen">

        <div class="title-deco deco1">✦</div>
        <div class="title-deco deco2">♡</div>
        <div class="title-deco deco3">✧</div>
        <div class="title-deco deco4">✦</div>

        <div class="title-content">

            <p class="title-small">
                ✦ おしゃれしてあそぼう！ ✦
            </p>

            <h1>
                おしゃれ<br>
                <span>スロット</span>
            </h1>

            <div class="title-character">

                <img
                    src="./media/body.png"
                    alt=""
                >

                <img
                    src="./media/top1.png"
                    alt=""
                >

                <img
                    src="./media/head1.png"
                    alt=""
                >

                <img
                    src="./media/shoes1.png"
                    alt=""
                >

            </div>

            <button id="startButton">
                スタート！
            </button>

        </div>

    </div>



    <!-- ========================
         ゲーム画面
    ========================= -->

    <div id="gameScreen">

        <header>

            <h1>
                おしゃれスロット
            </h1>

            <div class="score-area">

                <div>
                    ごうけい
                    <span id="totalScore">0</span>
                </div>

                <div>
                    こんかい
                    <span id="currentScore">0</span>
                </div>

            </div>

        </header>


        <main>


            <!-- キャラクター -->

            <div class="character-frame">

                <img
                    id="bodyImage"
                    src="./media/body.png"
                    alt="キャラクター"
                >

                <img
                    id="topImage"
                    src="./media/top1.png"
                    alt=""
                >

                <img
                    id="shoesImage"
                    src="./media/shoes1.png"
                    alt=""
                >

                <img
                    id="headImage"
                    src="./media/head1.png"
                    alt=""
                >

            </div>



            <!-- スロット -->

            <div class="slot-area">


                <div class="slot-title">
                    どんなコーデになるかな？
                </div>


                <div class="slot-labels">

                    <div class="slot-box">

                        <div class="slot-label">
                            あたま
                        </div>

                        <div
                            id="headSlot"
                            class="slot-result"
                        >
                            ガーリー
                        </div>

                    </div>


                    <div class="slot-box">

                        <div class="slot-label">
                            おようふく
                        </div>

                        <div
                            id="topSlot"
                            class="slot-result"
                        >
                            ガーリー
                        </div>

                    </div>


                    <div class="slot-box">

                        <div class="slot-label">
                            くつ
                        </div>

                        <div
                            id="shoesSlot"
                            class="slot-result"
                        >
                            ガーリー
                        </div>

                    </div>

                </div>


                <button
                    id="spinButton"
                    class="spin-button"
                >
                    スロットをまわす！
                </button>


                <button
                    id="wardrobeButton"
                    class="wardrobe-button"
                >
                    ♡ アイテムずかん ♡
                </button>


                <div class="result-area">

                    <div class="result-title">
                        ✦ けっか ✦
                    </div>

                    <div id="resultText">
                        スロットをまわしてね！
                    </div>

                    <div id="rarityText">
                        ♡ ふつう ♡
                    </div>

                </div>

            </div>

        </main>

    </div>



    <!-- ========================
         コーデ完成エフェクト
    ========================= -->

    <div
        id="completeEffect"
        class="complete-effect"
    >

        <div class="complete-star">
            ✦
        </div>

        <div
            id="completeText"
            class="complete-text"
        >
            コーデかんせい！
        </div>

        <div class="complete-star">
            ✦
        </div>

    </div>



    <!-- ========================
         キラキラエフェクト
    ========================= -->

    <div
        id="sparkleEffect"
        class="sparkle-effect"
    ></div>



    <!-- ========================
         スペシャルエフェクト
    ========================= -->

    <div
        id="specialEffect"
        class="special-effect"
    >

        <div class="special-stars">
            ✦　✧　✦
        </div>

        <div class="special-text">
            すごい！
        </div>

        <div class="special-sub">
            スペシャルアイテム！
        </div>

        <div class="special-stars">
            ✧　✦　✧
        </div>

    </div>



    <!-- ========================
         アイテムずかん
    ========================= -->

    <div
        id="wardrobeModal"
        class="modal"
    >

        <div class="modal-content">

            <button
                id="closeWardrobe"
                class="close-button"
            >
                ×
            </button>

            <h2>
                ♡ アイテムずかん ♡
            </h2>

            <div
                id="wardrobeList"
                class="wardrobe-list"
            ></div>

        </div>

    </div>


    <script src="./script.js"></script>

</body>

</html>
